<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DT | System Restoration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira+Code', monospace; background-color: #000; overflow: hidden; }
        
        /* Circuit Line Background Effect */
        .grid-bg {
            background-image: radial-gradient(circle, #ff8c00 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.1;
        }

        /* Glitch Animation */
        .glitch {
            position: relative;
            color: white;
            animation: glitch 1s linear infinite;
        }
        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }
        .glitch:before, .glitch:after {
            content: attr(data-text);
            position: absolute;
            left: 0;
        }
        .glitch:before { animation: glitchTop 1s linear infinite; clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%); }
        @keyframes glitchTop { 2%, 64% { transform: translate(2px, -2px); } 4%, 60% { transform: translate(-2px, 2px); } }

        /* Glowing Orange Pulse */
        .orange-glow {
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
            border: 1px solid #ff8c00;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen text-white">

    <div class="absolute inset-0 grid-bg"></div>

    <div class="relative z-10 text-center px-4">
        <div class="mb-8 inline-block">
            <h1 class="text-8xl font-bold glitch tracking-tighter" data-text="DT">DT</h1>
            <div class="h-1 w-full bg-orange-500 mt-2 animate-pulse"></div>
        </div>

        <h2 class="text-xl md:text-2xl font-bold uppercase tracking-[0.2em] mb-4 text-orange-500">
            System Integrity: <span id="percent">0</span>%
        </h2>

        <p class="text-gray-400 max-w-md mx-auto mb-10 text-sm md:text-base leading-relaxed">
            Unauthorized access detected and neutralized. Rebuilding core architecture with enhanced security protocols. <br>
            <span class="text-white font-bold italic" id="typewriter"></span>
        </p>

        <a href="https://wa.me/2348063250438" target="_blank" 
           class="orange-glow bg-transparent hover:bg-orange-600 hover:text-black transition-all duration-300 px-8 py-3 rounded-full font-bold uppercase tracking-widest inline-flex items-center gap-2">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.588-5.946 0-6.556 5.332-11.891 11.893-11.891 3.181 0 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.481 8.412 0 6.556-5.332 11.892-11.893 11.892-1.997 0-3.951-.5-5.688-1.448l-6.305 1.656zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.591 5.405 0 9.813-4.41 9.813-9.813 0-5.403-4.415-9.812-9.835-9.812-5.406 0-9.815 4.409-9.815 9.813 0 2.197.621 3.988 1.765 5.703l-1.12 4.091 4.1-.773z"/></svg>
            Secure Channel
        </a>
    </div>

    <script>
        // Percent Counter
        let count = 0;
        const target = 98;
        const counter = setInterval(() => {
            if (count < target) {
                count++;
                document.getElementById('percent').innerText = count;
            } else {
                clearInterval(counter);
            }
        }, 30);

        // Typewriter Effect
        const text = "STRONGER. FASTER. UNSTOPPABLE.";
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 100);
            }
        }
        typeWriter();
    </script>
</body>
      </html>
