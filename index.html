<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DT — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --orange: #FF8C00;
    --orange-dim: rgba(255,140,0,0.18);
    --orange-glow: rgba(255,140,0,0.5);
    --orange-faint: rgba(255,140,0,0.07);
    --white: #ffffff;
    --black: #000000;
    --mono: 'Share Tech Mono', monospace;
    --display: 'Orbitron', monospace;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: var(--mono);
    overflow: hidden;
  }

  /* ── CANVAS ── */
  #bg {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* ── SCAN LINE ── */
  .scan-line {
    position: fixed;
    left: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,140,0,0.15), transparent);
    z-index: 1;
    animation: scan 7s linear infinite;
    pointer-events: none;
  }
  @keyframes scan {
    0%   { top: -4px; }
    100% { top: 100vh; }
  }

  /* ── CORNER DECORATIONS ── */
  .corner {
    position: fixed;
    width: 28px; height: 28px;
    border-color: var(--orange);
    border-style: solid;
    opacity: 0.55;
    z-index: 2;
  }
  .corner.tl { top: 18px; left: 18px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 18px; right: 18px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 18px; left: 18px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 18px; right: 18px; border-width: 0 2px 2px 0; }

  /* ── TOP / BOTTOM BAR ── */
  .hud-bar {
    position: fixed;
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 56px;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--orange);
    opacity: 0.75;
    z-index: 3;
  }
  .hud-bar.top  { top: 0; }
  .hud-bar.bottom { bottom: 0; color: rgba(255,255,255,0.22); }

  /* ── CENTER STAGE ── */
  main {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 80px 24px;
  }

  /* ── LOGO ZONE ── */
  .logo-zone {
    position: relative;
    width: 148px; height: 148px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hex-ring {
    position: absolute;
    inset: 0;
    border: 2px solid var(--orange);
    clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    animation: hexGlow 2.8s ease-in-out infinite;
  }
  .hex-ring-inner {
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(255,140,0,0.3);
    clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  }
  @keyframes hexGlow {
    0%,100% { box-shadow: 0 0 8px var(--orange); filter: brightness(1); }
    50%      { box-shadow: 0 0 28px var(--orange), 0 0 55px var(--orange-glow); filter: brightness(1.15); }
  }

  /* Logo image (place your logo.png next to this file) */
  .logo-img {
    position: relative;
    z-index: 1;
    width: 80px;
    height: 80px;
    object-fit: contain;
    filter: brightness(0) invert(1);   /* makes any dark logo white */
    /* Remove the filter line if your logo is already white/colored */
  }

  /* Fallback text shown when logo.png not found */
  .logo-fallback {
    display: none;
    font-family: var(--display);
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--white);
    text-shadow: 0 0 12px rgba(255,255,255,0.4);
    animation: glitch 5s infinite;
  }
  @keyframes glitch {
    0%,90%,100% { transform: translate(0); clip-path: none; text-shadow: 0 0 12px rgba(255,255,255,0.4); }
    91%  { transform: translate(-3px, 1px);  clip-path: inset(8% 0 72% 0);  text-shadow: -2px 0 var(--orange), 2px 0 #0ff; }
    92%  { transform: translate(3px, -1px);  clip-path: inset(60% 0 8% 0);  text-shadow: 2px 0 var(--orange), -2px 0 #0ff; }
    93%  { transform: translate(-2px, 2px);  clip-path: inset(28% 0 52% 0); text-shadow: -1px 0 var(--orange); }
    94%  { transform: translate(2px, -2px);  clip-path: none; }
    95%  { transform: translate(-4px, 0);    clip-path: inset(4% 0 88% 0);  text-shadow: 3px 0 var(--orange), -3px 0 #0ff; }
    96%  { transform: translate(4px, 1px);   clip-path: none; text-shadow: 0 0 16px #fff; }
    97%  { transform: translate(0, -1px);    clip-path: inset(48% 0 32% 0); }
  }

  /* ── HEADING ── */
  .heading-sub {
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
  }
  .heading-main {
    font-family: var(--display);
    font-size: clamp(11px, 2vw, 14px);
    font-weight: 700;
    letter-spacing: 7px;
    color: var(--orange);
    text-align: center;
    line-height: 1.7;
    text-shadow: 0 0 18px var(--orange-glow);
  }

  /* ── TYPEWRITER ── */
  .typewriter {
    font-size: clamp(13px, 2.5vw, 16px);
    letter-spacing: 3px;
    color: var(--white);
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 24px;
  }
  .cursor {
    display: inline-block;
    width: 2px; height: 18px;
    background: var(--orange);
    animation: blink 0.85s step-end infinite;
  }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

  /* ── DIVIDER ── */
  .divider {
    width: min(520px, 90vw);
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--orange-glow), transparent);
    position: relative;
  }
  .divider::before {
    content: '';
    position: absolute;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--orange);
    top: -3px; left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 10px var(--orange);
  }

  /* ── INTEGRITY BLOCK ── */
  .integrity-block {
    width: min(520px, 90vw);
    border: 1px solid rgba(255,140,0,0.28);
    background: var(--orange-faint);
    padding: 18px 22px;
  }
  .integrity-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .integrity-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--orange);
  }
  .integrity-pct {
    font-family: var(--display);
    font-size: 14px;
    font-weight: 700;
    color: var(--orange);
    text-shadow: 0 0 8px var(--orange-glow);
  }
  .bar-track {
    height: 6px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,140,0,0.2);
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--orange), #ffbb55);
    transition: width 0.5s ease;
    position: relative;
  }
  .bar-fill::after {
    content:'';
    position: absolute;
    top:0; right:0;
    width:40px; height:100%;
    background: linear-gradient(90deg,transparent,rgba(255,255,255,0.38));
    animation: barSweep 1.6s linear infinite;
  }
  @keyframes barSweep {
    0%   { transform: translateX(-80px); }
    100% { transform: translateX(40px); }
  }
  .bar-ticks {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
  }
  .tick { width:1px; height:4px; background: rgba(255,140,0,0.28); }

  /* ── STATS ROW ── */
  .stats-row {
    display: flex;
    gap: 14px;
    width: min(520px, 90vw);
  }
  .stat {
    flex: 1;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.02);
    padding: 12px 16px;
  }
  .stat-lbl {
    font-size: 9px;
    letter-spacing: 2.5px;
    color: rgba(255,255,255,0.3);
    margin-bottom: 5px;
  }
  .stat-val {
    font-family: var(--display);
    font-size: 13px;
    color: rgba(255,255,255,0.65);
  }
  .stat-val.lit {
    color: var(--orange);
    text-shadow: 0 0 8px var(--orange-glow);
  }

  /* ── WHATSAPP BUTTON ── */
  .wa-btn {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    border: 1px solid var(--orange);
    color: var(--orange);
    background: transparent;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-decoration: none;
    padding: 15px 36px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: background 0.3s, box-shadow 0.3s;
    box-shadow: 0 0 14px rgba(255,140,0,0.22), inset 0 0 14px rgba(255,140,0,0.06);
    animation: btnPulse 3.2s ease-in-out infinite;
  }
  @keyframes btnPulse {
    0%,100% { box-shadow: 0 0 14px rgba(255,140,0,0.22), inset 0 0 14px rgba(255,140,0,0.06); }
    50%      { box-shadow: 0 0 28px rgba(255,140,0,0.5), inset 0 0 22px rgba(255,140,0,0.14), 0 0 50px rgba(255,140,0,0.18); }
  }
  .wa-btn::before {
    content:'';
    position: absolute;
    top:0; left:-100%; width:100%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(255,140,0,0.14), transparent);
    transition: left 0.55s;
  }
  .wa-btn:hover { background: rgba(255,140,0,0.1); }
  .wa-btn:hover::before { left: 100%; }
  .wa-icon { width:18px; height:18px; fill: var(--orange); flex-shrink:0; }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="scan-line"></div>

<!-- Corner brackets -->
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<!-- HUD bars -->
<div class="hud-bar top">
  <span>SYS_BUILD_V2.0</span>
  <span id="live-time">--:--:--</span>
  <span>NODE_ACTIVE</span>
</div>
<div class="hud-bar bottom">
  <span>ENCRYPTED_LINK_ACTIVE</span>
  <span>© DT_PORTFOLIO_2025</span>
</div>

<main>

  <!-- LOGO -->
  <div class="logo-zone">
    <div class="hex-ring"></div>
    <div class="hex-ring-inner"></div>
    <!--
      Place your logo.png in the same folder as this HTML file.
      The image is rendered white by default (filter: invert).
      Remove the CSS filter if your logo is already white/orange.
    -->
    <img
      class="logo-img"
      src="Destiny Tch.png"
      alt="DT Logo"
      onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block';"
    />
    <span class="logo-fallback">DT</span>
  </div>

  <div class="heading-sub">DIGITAL PORTFOLIO // SYSTEM REBOOT</div>

  <div class="heading-main">
    PORTFOLIO VAULT<br>UNDER RECONSTRUCTION
  </div>

  <div class="typewriter">
    <span id="tw"></span>
    <span class="cursor"></span>
  </div>

  <div class="divider"></div>

  <!-- SYSTEM INTEGRITY -->
  <div class="integrity-block">
    <div class="integrity-header">
      <span class="integrity-label">// SYSTEM INTEGRITY</span>
      <span class="integrity-pct" id="int-pct">95.4%</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="int-bar" style="width:95.4%"></div>
    </div>
    <div class="bar-ticks" id="ticks"></div>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat">
      <div class="stat-lbl">STATUS</div>
      <div class="stat-val lit">BUILDING</div>
    </div>
    <div class="stat">
      <div class="stat-lbl">ETA</div>
      <div class="stat-val" id="eta">--:--:--</div>
    </div>
    <div class="stat">
      <div class="stat-lbl">MODULES</div>
      <div class="stat-val lit">7 / 9</div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- WHATSAPP BUTTON — replace YOUR_NUMBER with your digits, no + or spaces -->
  <a class="wa-btn" href="https://wa.me/YOUR_NUMBER" target="_blank" rel="noopener">
    <svg class="wa-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
    DIRECT LINE // WHATSAPP
  </a>

</main>

<script>
/* ── CANVAS BACKGROUND ── */
(function () {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let W, H, nodes = [], mouse = { x: -999, y: -999 };

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = -999; mouse.y = -999; });

  for (let i = 0; i < 38; i++) {
    nodes.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.45,
      vy: (Math.random() - 0.5) * 0.45,
    });
  }

  function drawGrid() {
    const g = 58;
    ctx.strokeStyle = 'rgba(255,140,0,0.04)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < W; x += g) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += g) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    drawGrid();

    nodes.forEach(n => {
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0 || n.x > W) n.vx *= -1;
      if (n.y < 0 || n.y > H) n.vy *= -1;
      const dx = mouse.x - n.x, dy = mouse.y - n.y;
      const d = Math.hypot(dx, dy);
      if (d < 110) { n.vx += dx / d * 0.04; n.vy += dy / d * 0.04; }
      const spd = Math.hypot(n.vx, n.vy);
      if (spd > 1.8) { n.vx *= 0.96; n.vy *= 0.96; }
    });

    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const d = Math.hypot(b.x - a.x, b.y - a.y);
        if (d < 150) {
          ctx.strokeStyle = `rgba(255,140,0,${(1 - d / 150) * 0.32})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }

    nodes.forEach(n => {
      const md = Math.hypot(mouse.x - n.x, mouse.y - n.y);
      ctx.fillStyle = `rgba(255,140,0,${md < 130 ? 0.9 : 0.35})`;
      ctx.beginPath(); ctx.arc(n.x, n.y, 2, 0, Math.PI * 2); ctx.fill();
    });

    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── LIVE CLOCK ── */
(function () {
  const el = document.getElementById('live-time');
  setInterval(() => { el.textContent = new Date().toTimeString().slice(0, 8); }, 1000);
  el.textContent = new Date().toTimeString().slice(0, 8);
})();

/* ── TYPEWRITER ── */
(function () {
  const phrases = [
    'REBUILDING STRONGER...',
    'LOADING NEW MODULES...',
    'OPTIMIZING SYSTEMS...',
    'VAULT DOORS: SEALED...',
  ];
  let pi = 0, ci = 0, del = false;
  const el = document.getElementById('tw');

  function tick() {
    const p = phrases[pi];
    el.textContent = del ? p.slice(0, ci - 1) : p.slice(0, ci + 1);
    del ? ci-- : ci++;
    if (!del && ci === p.length) { del = true; return setTimeout(tick, 2400); }
    if (del && ci === 0) { del = false; pi = (pi + 1) % phrases.length; return setTimeout(tick, 380); }
    setTimeout(tick, del ? 44 : 88);
  }
  tick();
})();

/* ── INTEGRITY BAR ── */
(function () {
  const ticks = document.getElementById('ticks');
  for (let i = 0; i < 20; i++) {
    const d = document.createElement('div');
    d.className = 'tick'; ticks.appendChild(d);
  }

  let val = 95.4;
  const bar = document.getElementById('int-bar');
  const pct = document.getElementById('int-pct');

  setInterval(() => {
    val = Math.min(97.5, Math.max(93.2, val + (Math.random() - 0.5) * 1.3));
    const v = val.toFixed(1);
    bar.style.width = v + '%';
    pct.textContent = v + '%';
  }, 950);
})();

/* ── COUNTDOWN ── */
(function () {
  let s = 7 * 24 * 3600;
  const el = document.getElementById('eta');
  function fmt() {
    const h = String(Math.floor(s / 3600)).padStart(2, '0');
    const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
    const sec = String(s % 60).padStart(2, '0');
    el.textContent = h + ':' + m + ':' + sec;
  }
  fmt();
  setInterval(() => { s = Math.max(0, s - 1); fmt(); }, 1000);
})();
</script>
</body>
</html>
